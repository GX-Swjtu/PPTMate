user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  client_max_body_size 110M;
  log_format json escape=json
    '{"timestamp":"$time_iso8601","level":"info","logger":"nginx.access",'
    '"method":"$request_method","path":"$uri","status":$status,'
    '"bytes":$body_bytes_sent,"duration_seconds":$request_time}';
  access_log /dev/stdout json;

  server {
    listen 80;
    server_name _;

    location = /health {
      proxy_pass http://127.0.0.1:8000/health;
    }

    location = /ready {
      proxy_pass http://127.0.0.1:8000/ready;
    }

    location = /oidc/callback {
      proxy_pass http://127.0.0.1:8000/oidc/callback$is_args$args;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header X-Forwarded-Host $http_host;
    }

    location = /metrics { return 404; }
    location = /docs { return 404; }
    location = /redoc { return 404; }
    location = /openapi.json { return 404; }
    location = /mcp { return 404; }
    location ^~ /mcp/ { return 404; }
    location ^~ /api/v1/auth/token/ { return 404; }
    location ^~ /api/v1/webhook/ { return 404; }
    location ^~ /api/v1/mock/ { return 404; }
    location ^~ /api/v1/ppt/community/ { return 404; }
    location ^~ /api/v1/ppt/codex/ { return 404; }
    location ^~ /api/v1/ppt/ollama/ { return 404; }

    location /api/v1/ {
      error_page 413 = @request_entity_too_large;
      proxy_pass http://127.0.0.1:8000;
      proxy_read_timeout 30m;
      proxy_send_timeout 30m;
      proxy_connect_timeout 30s;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header X-PPTMate-Internal "";
    }

    location @request_entity_too_large {
      default_type application/json;
      return 413 '{"detail":"Request body must be no larger than 110MB."}';
    }

    location = /_auth_check {
      internal;
      proxy_pass http://127.0.0.1:8000/api/v1/auth/verify;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Original-URI $request_uri;
      proxy_set_header Host $host;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header X-PPTMate-Internal "";
    }

    location @asset_not_found { return 404; }

    location /static/ {
      alias /app/servers/fastapi/static/;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    location /app_data/images/ {
      auth_request /_auth_check;
      error_page 403 =404 @asset_not_found;
      alias /app_data/images/;
      disable_symlinks on;
      add_header Cache-Control "private, max-age=31536000";
    }

    location /app_data/exports/ {
      auth_request /_auth_check;
      error_page 403 =404 @asset_not_found;
      alias /app_data/exports/;
      disable_symlinks on;
      add_header Cache-Control "private, max-age=31536000";
    }

    location /app_data/uploads/ {
      auth_request /_auth_check;
      error_page 403 =404 @asset_not_found;
      alias /app_data/uploads/;
      disable_symlinks on;
      add_header Cache-Control "private, max-age=31536000";
    }

    location /app_data/fonts/ {
      alias /app_data/fonts/;
      disable_symlinks on;
      add_header Cache-Control "private, max-age=31536000";
    }

    location /app_data/templates/ {
      alias /app_data/templates/;
      disable_symlinks on;
      add_header Cache-Control "private, max-age=31536000";
    }

    location /app_data/pptx-to-html/ {
      auth_request /_auth_check;
      error_page 403 =404 @asset_not_found;
      alias /app_data/pptx-to-html/;
      disable_symlinks on;
      add_header Cache-Control "private, max-age=31536000";
    }

    location /app_data/pptx-to-json/ {
      auth_request /_auth_check;
      error_page 403 =404 @asset_not_found;
      alias /app_data/pptx-to-json/;
      disable_symlinks on;
      add_header Cache-Control "private, max-age=31536000";
    }

    location / {
      proxy_pass http://127.0.0.1:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_read_timeout 30m;
      add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; connect-src 'self'; worker-src 'self' blob:; font-src 'self' data:; frame-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
      add_header Referrer-Policy "same-origin" always;
      add_header X-Content-Type-Options "nosniff" always;
    }
  }

  server {
    listen 9090;
    server_name _;

    location = /metrics {
      proxy_pass http://127.0.0.1:8000/metrics;
    }

    location / { return 404; }
  }
}
